<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ontologizer</title>
<link rel="icon" href="/shared/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/shared/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/shared/brand/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ontologizer-base" content="">
<!--importmap-->
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/panels.css">
<link rel="stylesheet" href="/shell/controls.css">
<script type="module" src="/shell/main.js"></script>
</head>
<body>
<div id="view"></div>
<div id="loading" aria-label="Loading the map" role="status"><img class="brand-dark" src="/shared/brand/symbol-dark.svg" alt="" width="64" height="64"><img class="brand-light" src="/shared/brand/symbol-light.svg" alt="" width="64" height="64"></div>
<header id="topbar">
  <span class="brand-mark" aria-hidden="true"><img class="brand-dark" src="/shared/brand/symbol-dark.svg" alt="" width="22" height="22"><img class="brand-light" src="/shared/brand/symbol-light.svg" alt="" width="22" height="22"></span>
  <span id="map-name"></span>
  <div id="search"></div>
  <div id="chat-btn"></div>
  <div id="filter"></div>
  <div id="view-switcher"></div>
  <div id="lens-switcher"></div>
  <div id="fuse"></div>
  <div id="export"></div>
  <div id="theme-switcher"></div>
  <div id="server-panel" hidden></div>
</header>
<div id="minimap" hidden></div>
<div id="side-tabs" hidden></div>
<aside id="explain"></aside>
<aside id="chat" hidden></aside>
<div id="ticker"></div>
<div id="jobs"></div>
<div id="legend"></div>
<div id="menu"></div>
<div id="conn" role="status" hidden>Lost the connection to ontologizer. Is it still running? Retrying…</div>
</body>
</html>
